<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>mine Student Result Calculator</h1>

        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Enter student name">

        <label>Subject 1 Marks</label>
        <input type="number" id="mark1" placeholder="Enter marks">

        <label>Subject 2 Marks</label>
        <input type="number" id="mark2" placeholder="Enter marks">

        <label>Subject 3 Marks</label>
        <input type="number" id="mark3" placeholder="Enter marks">

        <button onclick="calculateResult()">
            Calculate Result
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
